[package]
name = "packet28d"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
default = []
shared-repository-scan = [
  "mapy-core/shared-repository-scan",
  "packet28-search-core/shared-repository-scan",
]

[[bin]]
name = "packet28d"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
context-kernel-core.workspace = true
context-memory-core.workspace = true
diffy-core.workspace = true
suite-foundation-core.workspace = true
covy-ingest.workspace = true
mapy-core.workspace = true
ignore.workspace = true
notify.workspace = true
packet28-daemon-client.workspace = true
packet28-daemon-core.workspace = true
packet28-daemon-protocol.workspace = true
packet28-reducer-core.workspace = true
packet28-search-core.workspace = true
packet28-state-fs.workspace = true
serde.workspace = true
serde_json.workspace = true
suite-packet-core.workspace = true
testy-core.workspace = true
blake3.workspace = true
tokio = { workspace = true, features = ["net"] }
libc.workspace = true
fs2 = "0.4"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
