name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-gates:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install pinned cargo-deny
        run: |
          scripts/install_cargo_deny.sh "$RUNNER_TEMP/cargo-deny-bin"
          echo "$RUNNER_TEMP/cargo-deny-bin" >> "$GITHUB_PATH"

      - name: Run tag-aware canonical gate
        run: |
          set -o pipefail
          mkdir -p .packet28/benchmarks
          scripts/validate_full_gate.sh --release-tag "$GITHUB_REF_NAME" 2>&1 \
            | tee .packet28/benchmarks/release-full-gate.log

      # The canonical gate above built target/debug and ran every delegated
      # product test; its log is the same-tree receipt for those contracts.
      - name: Run agent DX benchmark
        run: |
          python3 scripts/benchmark_agent_dx.py \
            --bin-dir "$GITHUB_WORKSPACE/target/debug" \
            --product-test-log .packet28/benchmarks/release-full-gate.log \
            --artifact-dir "$GITHUB_WORKSPACE/.packet28/benchmarks/release-agent-dx"

      - name: Validate agent DX benchmark
        if: always()
        run: |
          python3 scripts/validate_agent_dx_benchmark.py \
            "$GITHUB_WORKSPACE/.packet28/benchmarks/release-agent-dx/summary.json" \
            --bin-dir "$GITHUB_WORKSPACE/target/debug" \
            --markdown-path "$GITHUB_WORKSPACE/.packet28/benchmarks/release-agent-dx-validation.md"

      - name: Check manifest artifacts are committed
        run: node scripts/check_experiment_manifest_artifacts_tracked.mjs

      - name: Verify experiment manifest
        run: |
          target/debug/Packet28 verify experiments --root . --json \
            --require-workflow "Claude Code, Gemini, and OpenCode runtime integration smoke" \
            --require-workflow "Packet28 real repository parity and indexed search evidence across packet28, ripgrep, and fd" \
            --require-workflow "Packet28 repeatable fixture-suite smoke across Rust, Node, and docs repositories" \
            --require-workflow "Optional fff MCP search backend comparison and adapter smoke" \
            --require-workflow "Packet28 broker plan validation CLI with mapped test-gate score evidence" \
            --require-workflow "Packet28 code-navigation experiment on ClaudeCode main source snapshot" \
            --require-workflow "Packet28 versus normal tools on a generated agentic Rust bug-fix task" \
            --require-workflow "Packet28 release smoke for published npm package and install path"

      - name: Verify release notes
        run: |
          set -euo pipefail
          test -s "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Publish release gate summary
        if: always()
        run: |
          for file in \
            .packet28/benchmarks/release-agent-dx-validation.md; do
            if [ -f "$file" ]; then
              cat "$file" >> "$GITHUB_STEP_SUMMARY"
              printf '\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload release gate artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gate-benchmarks
          path: .packet28/benchmarks

  build:
    needs: release-gates
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            platform: darwin-arm64
            npm_os: darwin
            npm_cpu: arm64
            smoke_mode: native
            smoke_reason: ""
          - target: x86_64-apple-darwin
            os: macos-14
            platform: darwin-x64
            npm_os: darwin
            npm_cpu: x64
            smoke_mode: native-or-metadata
            smoke_reason: "The hosted macOS runner may be ARM64; x86_64 execution requires an Intel runner or Rosetta and remains an external release check."
          - target: x86_64-unknown-linux-musl
            shim_target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64
            npm_os: linux
            npm_cpu: x64
            smoke_mode: native
            smoke_reason: ""
          - target: aarch64-unknown-linux-musl
            shim_target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-arm64
            npm_os: linux
            npm_cpu: arm64
            smoke_mode: qemu-aarch64
            smoke_reason: ""

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.93.1
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (Linux)
        if: matrix.npm_os == 'linux'
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 88f49ff79e777bef6d3564531636ee4d3cc2f8d2 --locked

      - name: Install qemu user emulator (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
          command -v qemu-aarch64

      - name: Build release binaries
        run: |
          BIN_ARGS="$(python3 scripts/release_artifacts.py executables | sed 's/^/--bin /' | tr '\n' ' ')"
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cross build --release --locked --target ${{ matrix.target }} --workspace $BIN_ARGS
          else
            cargo build --release --locked --target ${{ matrix.target }} --workspace $BIN_ARGS
          fi
          if [ "${{ matrix.npm_os }}" = "linux" ]; then
            # The CLI is static musl; the preload library must be a shared
            # library for the GNU libc used by the processes it interposes.
            cross build --release --locked --target "${{ matrix.shim_target }}" --package context-instruct-shim
          fi

      - name: Stage platform package
        run: |
          PKG_DIR="dist/@packet28/${{ matrix.platform }}"
          mkdir -p "$PKG_DIR/bin"

          while IFS= read -r artifact; do
            ARTIFACT_TARGET="${{ matrix.target }}"
            if [ "$artifact" = "libcontext_instruct_shim.so" ]; then
              ARTIFACT_TARGET="${{ matrix.shim_target }}"
            fi
            cp "target/$ARTIFACT_TARGET/release/$artifact" "$PKG_DIR/bin/"
            chmod +x "$PKG_DIR/bin/$artifact"
          done < <(
            python3 scripts/release_artifacts.py platform \
              --platform "${{ matrix.platform }}"
          )

          # Strip runtime artifacts to reduce size.
          if command -v strip &> /dev/null; then
            strip "$PKG_DIR"/bin/* 2>/dev/null || true
          fi

          # Generate package.json from template
          VERSION="${GITHUB_REF_NAME#v}"
          sed -e "s/PLATFORM/${{ matrix.platform }}/g" \
              -e "s/\"OS\"/\"${{ matrix.npm_os }}\"/g" \
              -e "s/\"CPU\"/\"${{ matrix.npm_cpu }}\"/g" \
              npm/platform-template/package.json > "$PKG_DIR/package.json"
          VERSION="$VERSION" PACKAGE_JSON="$PKG_DIR/package.json" node <<'NODE'
          const fs = require('fs');
          const pkgPath = process.env.PACKAGE_JSON;
          const version = process.env.VERSION;
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Smoke staged platform package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/verify_release_packages.py platform \
            --package-dir "dist/@packet28/${{ matrix.platform }}" \
            --platform "${{ matrix.platform }}" \
            --version "$VERSION" \
            --run-mode "${{ matrix.smoke_mode }}" \
            --skip-reason "${{ matrix.smoke_reason }}"

      # upload-artifact does not preserve Unix executable modes, so transfer a
      # tar archive and revalidate its extracted contents in the publish job.
      - name: Archive verified platform package
        run: |
          PKG_DIR="dist/@packet28/${{ matrix.platform }}"
          tar -C "$PKG_DIR" -czf "dist/pkg-${{ matrix.platform }}.tar.gz" .

      - name: Upload platform package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-${{ matrix.platform }}
          path: dist/pkg-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  publish:
    needs:
      - release-gates
      - build
    permissions:
      actions: read
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org

      - name: Download all platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/platforms

      - name: Extract platform packages with executable modes
        run: |
          set -euo pipefail
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            PKG_DIR="dist/platforms/pkg-${platform}"
            ARCHIVE="$PKG_DIR/pkg-${platform}.tar.gz"
            test -f "$ARCHIVE"
            tar -xzf "$ARCHIVE" -C "$PKG_DIR"
          done

      - name: Stage root package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ROOT_DIR="dist/packet28"
          cp -r npm/packet28/ "$ROOT_DIR/"
          VERSION="$VERSION" PACKAGE_JSON="$ROOT_DIR/package.json" node <<'NODE'
          const fs = require('fs');
          const pkgPath = process.env.PACKAGE_JSON;
          const version = process.env.VERSION;
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = version;
          for (const name of ['@packet28/darwin-arm64', '@packet28/darwin-x64', '@packet28/linux-x64', '@packet28/linux-arm64']) {
            if (pkg.optionalDependencies && pkg.optionalDependencies[name]) {
              pkg.optionalDependencies[name] = version;
            }
          }
          fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          for wrapper in "$ROOT_DIR"/bin/*.js; do
            if [ "$(basename "$wrapper")" != "native-launcher.js" ]; then
              chmod +x "$wrapper"
            fi
          done

      - name: Dry-run every npm package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            python3 scripts/verify_release_packages.py platform \
              --package-dir "dist/platforms/pkg-${platform}" \
              --platform "$platform" \
              --version "$VERSION" \
              --run-mode native-or-metadata \
              --skip-reason "The Linux publish host revalidates headers and npm metadata; cross-platform execution already ran in the build matrix."
          done
          python3 scripts/verify_release_packages.py npm \
            --package-dir dist/packet28 \
            --version "$VERSION"

      - name: Publish platform packages
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          REGISTRY="https://registry.npmjs.org"

          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            PKG_DIR="dist/platforms/pkg-${platform}"
            PACKAGE_NAME="@packet28/${platform}"

            if npm view "${PACKAGE_NAME}@${VERSION}" version --registry="$REGISTRY" >/dev/null 2>&1; then
              echo "${PACKAGE_NAME}@${VERSION} already published, skipping"
              continue
            fi

            echo "Publishing ${PACKAGE_NAME}@${VERSION}..."
            if ! (cd "$PKG_DIR" && npm publish --access public --provenance --registry="$REGISTRY"); then
              if npm view "${PACKAGE_NAME}@${VERSION}" version --registry="$REGISTRY" >/dev/null 2>&1; then
                echo "${PACKAGE_NAME}@${VERSION} was published concurrently, skipping"
                continue
              fi
              exit 1
            fi
          done

      - name: Publish root package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          REGISTRY="https://registry.npmjs.org"
          ROOT_DIR="dist/packet28"

          if npm view "packet28@${VERSION}" version --registry="$REGISTRY" >/dev/null 2>&1; then
            echo "packet28@${VERSION} already published, skipping"
            exit 0
          fi
          echo "Publishing packet28@${VERSION}..."
          if ! (cd "$ROOT_DIR" && npm publish --access public --provenance --registry="$REGISTRY"); then
            if npm view "packet28@${VERSION}" version --registry="$REGISTRY" >/dev/null 2>&1; then
              echo "packet28@${VERSION} was published concurrently, skipping"
              exit 0
            fi
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "Packet28 ${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
