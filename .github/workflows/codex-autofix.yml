name: Codex Autofix

on:
  workflow_run:
    workflows:
      - Build
      - Agent DX Benchmark
      - Context Anomalies
      - Experiment Manifest
      - Handoff Readiness
      - Memory Lint
      - Reducer Drift
      - Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: "Failed GitHub Actions run id to inspect"
        required: true

# Candidate code is inspected with a read-only token. A separate job applies the
# generated patch without executing it and owns the narrowly scoped write token.
permissions:
  contents: read

concurrency:
  group: codex-autofix-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  autofix:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        github.event.workflow_run.name != 'Codex Autofix'
      )
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      has_diff: ${{ steps.patch.outputs.has_diff }}
      run_url: ${{ steps.resolve.outputs.run_url }}
      target_ref: ${{ steps.resolve.outputs.target_ref }}
    env:
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
      TARGET_ROOT: ${{ github.workspace }}/target
      TRUSTED_AUTOFIX: ${{ github.workspace }}/trusted-control/scripts/ci/codex_autofix.sh
      TRUSTED_RUN_VALIDATOR: ${{ github.workspace }}/trusted-control/scripts/ci/validate_autofix_run.py
      CODEX_AUTOFIX_VERIFY: cargo test --locked --workspace --all-targets
    steps:
      - name: Check out trusted control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-control
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve trusted failed run
        id: resolve
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RUN_METADATA: ${{ runner.temp }}/codex-autofix-run.json
        run: |
          case "$RUN_ID" in
            ""|*[!0-9]*)
              echo "run_id must contain only decimal digits" >&2
              exit 1
              ;;
          esac
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > "$RUN_METADATA"
          resolution="$(
            python3 "$TRUSTED_RUN_VALIDATOR" \
              --metadata "$RUN_METADATA" \
              --repository "$GITHUB_REPOSITORY" \
              --default-branch "$DEFAULT_BRANCH"
          )"
          target_ref="$(jq -r '.target_ref' <<<"$resolution")"
          run_url="$(jq -r '.run_url' <<<"$resolution")"
          git -C trusted-control fetch --no-tags origin "$target_ref"
          git -C trusted-control merge-base --is-ancestor \
            "$target_ref" "origin/$DEFAULT_BRANCH"
          echo "target_ref=$target_ref" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"

      - name: Check out repair target without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.target_ref }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Validate trusted autofix driver
        working-directory: target
        env:
          CODEX_AUTOFIX_ROOT: ${{ env.TARGET_ROOT }}
          CODEX_AUTOFIX_DRY_RUN: "1"
          CI_FAILURE_LOG: ${{ env.TARGET_ROOT }}/.packet28/ci-autofix/failure.log
          CI_RUN_URL: ${{ steps.resolve.outputs.run_url }}
        run: |
          bash -n "$TRUSTED_AUTOFIX"
          mkdir -p .packet28/ci-autofix
          printf 'simulated failing test log\n' > .packet28/ci-autofix/failure.log
          bash "$TRUSTED_AUTOFIX"
          test -s .packet28/ci-autofix/prompt.txt

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.93.1

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: target

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"

      - name: Install Codex CLI
        run: |
          npm install -g @openai/codex@0.145.0
          test "$(codex --version)" = "codex-cli 0.145.0"

      - name: Capture failed run logs
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .packet28/ci-autofix
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log \
            > .packet28/ci-autofix/failure.log
          test -s .packet28/ci-autofix/failure.log

      - name: Run trusted Codex autofix driver
        working-directory: target
        env:
          CODEX_AUTOFIX_ROOT: ${{ env.TARGET_ROOT }}
          CI_FAILURE_LOG: ${{ env.TARGET_ROOT }}/.packet28/ci-autofix/failure.log
          CI_RUN_URL: ${{ steps.resolve.outputs.run_url }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured; skipping Codex autofix."
            exit 78
          fi
          bash "$TRUSTED_AUTOFIX"

      - name: Verify generated fix without secrets
        working-directory: target
        run: |
          if git diff --quiet -- . ':!.packet28'; then
            echo "No autofix diff was produced."
            exit 0
          fi
          cargo fmt --check
          bash -lc "$CODEX_AUTOFIX_VERIFY"

      - name: Seal candidate patch
        id: patch
        working-directory: target
        run: |
          if git diff --quiet -- . ':!.packet28'; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --check -- . ':!.packet28'
          git diff --binary --full-index -- . ':!.packet28' > .packet28/ci-autofix/diff.patch
          test -s .packet28/ci-autofix/diff.patch
          sha256sum .packet28/ci-autofix/diff.patch > .packet28/ci-autofix/diff.patch.sha256
          echo "has_diff=true" >> "$GITHUB_OUTPUT"

      - name: Upload autofix evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-autofix-${{ env.RUN_ID }}-${{ github.run_attempt }}
          path: target/.packet28/ci-autofix
          include-hidden-files: true

  publish:
    if: needs.autofix.outputs.has_diff == 'true'
    needs: autofix
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
      RUN_URL: ${{ needs.autofix.outputs.run_url }}
      TARGET_REF: ${{ needs.autofix.outputs.target_ref }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out verified repair base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download sealed patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-autofix-${{ env.RUN_ID }}-${{ github.run_attempt }}
          path: .packet28/ci-autofix

      - name: Apply patch without executing candidate code
        run: |
          sha256sum --check .packet28/ci-autofix/diff.patch.sha256
          git apply --check --binary .packet28/ci-autofix/diff.patch
          git apply --index --binary .packet28/ci-autofix/diff.patch
          git diff --cached --check

      - name: Commit and push autofix branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="codex-autofix/run-${RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git -c core.hooksPath=/dev/null commit -m "Codex autofix for CI run ${RUN_ID}"
          gh auth setup-git
          git push -u origin "$branch"
          echo "AUTOFIX_BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Open draft autofix pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body_file=".packet28/ci-autofix/pr-body.md"
          {
            echo "Automated Codex attempt to fix failing CI run ${RUN_URL}."
            echo
            if test -s .packet28/ci-autofix/final.md; then
              echo "## Codex summary"
              cat .packet28/ci-autofix/final.md
            fi
          } > "$body_file"
          gh pr create \
            --draft \
            --title "Codex autofix for CI run ${RUN_ID}" \
            --body-file "$body_file" \
            --base "$DEFAULT_BRANCH" \
            --head "$AUTOFIX_BRANCH"
