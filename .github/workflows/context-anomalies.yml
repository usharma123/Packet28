name: Context Anomalies

on:
  pull_request:
    paths:
      - ".github/workflows/context-anomalies.yml"
      - "docs/AGENTIC_CONTEXT_IDEAS.md"
      - "docs/context-anomalies/**"
      - "scripts/audit_context_anomaly_hidden_samples.mjs"
      - "scripts/check_context_anomaly_hidden_samples.mjs"
      - "scripts/check_context_anomaly_runbook_density.mjs"
      - "scripts/check_context_anomaly_summary_budget.mjs"
      - "crates/suite-cli/src/cmd_dashboard.rs"
      - "crates/suite-cli/src/cmd_digest.rs"
      - "crates/suite-cli/src/cmd_mcp.rs"
      - "crates/suite-cli/src/cmd_verify.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/context-anomalies.yml"
      - "docs/AGENTIC_CONTEXT_IDEAS.md"
      - "docs/context-anomalies/**"
      - "scripts/audit_context_anomaly_hidden_samples.mjs"
      - "scripts/check_context_anomaly_hidden_samples.mjs"
      - "scripts/check_context_anomaly_runbook_density.mjs"
      - "scripts/check_context_anomaly_summary_budget.mjs"
      - "crates/suite-cli/src/cmd_dashboard.rs"
      - "crates/suite-cli/src/cmd_digest.rs"
      - "crates/suite-cli/src/cmd_mcp.rs"
      - "crates/suite-cli/src/cmd_verify.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
    inputs:
      strict_audit:
        description: "Run the hidden-sample audit with release-like --max-high 0"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.93.1

      - name: Check context anomaly runbook density
        run: |
          node scripts/check_context_anomaly_runbook_density.mjs --help
          node scripts/check_context_anomaly_runbook_density.mjs
          node scripts/check_context_anomaly_runbook_density.mjs --self-test

      - name: Check context anomaly summary budget
        run: |
          node scripts/check_context_anomaly_summary_budget.mjs --help
          node scripts/check_context_anomaly_summary_budget.mjs --self-test

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Build Packet28 CLI
        run: cargo build --locked -p suite-cli

      - name: Audit context anomaly hidden samples
        env:
          STRICT_AUDIT: ${{ github.event_name == 'workflow_dispatch' && inputs.strict_audit || false }}
        run: |
          set -o pipefail
          node scripts/audit_context_anomaly_hidden_samples.mjs --help
          node scripts/audit_context_anomaly_hidden_samples.mjs | tee context-anomaly-hidden-sample-audit.txt
          node scripts/audit_context_anomaly_hidden_samples.mjs --json > context-anomaly-hidden-sample-audit.json
          if [ "$STRICT_AUDIT" = "true" ]; then
            node scripts/audit_context_anomaly_hidden_samples.mjs --strict
          fi

      - name: Upload context anomaly audit output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: context-anomaly-hidden-sample-audit
          path: |
            context-anomaly-hidden-sample-audit.txt
            context-anomaly-hidden-sample-audit.json
          if-no-files-found: ignore

      - name: Verify context anomaly thresholds
        run: |
          set -o pipefail
          target/debug/Packet28 verify context-anomalies --root . --max-high 0 --max-trend-age-ms 604800000 --json | tee context-anomalies.json

      - name: Summarize context anomalies
        if: always()
        run: |
          target/debug/Packet28 dashboard --root . --json > context-anomaly-dashboard.json || echo '{"context_anomalies":{}}' > context-anomaly-dashboard.json
          target/debug/Packet28 dashboard --root . --context-anomaly-history docs/context-anomalies/history.jsonl --json > context-anomaly-fixture-dashboard.json || echo '{"context_anomalies":{}}' > context-anomaly-fixture-dashboard.json
          audit_mode_line="$(jq -r '"audit_mode=\(.audit_mode) verifier=\(if .verifier.ok then "ok" else "failed" end) high=\(.verifier.high) max_high=\(.verifier.max_high)"' context-anomaly-hidden-sample-audit.json 2>/dev/null || grep '^audit_mode=' context-anomaly-hidden-sample-audit.txt || true)"
          audit_output_checksum="$(node scripts/audit_context_anomaly_hidden_samples.mjs --checksum context-anomaly-hidden-sample-audit.txt 2>/dev/null || printf 'missing-audit-text')"
          audit_json_checksum="$(node scripts/audit_context_anomaly_hidden_samples.mjs --checksum context-anomaly-hidden-sample-audit.json 2>/dev/null || printf 'missing-audit-json')"
          trend_repair_hint="$(jq -r '.trend_repair_hint // empty' context-anomalies.json)"
          hidden_sample_jq='def cat_escape: gsub("%"; "%25") | gsub("="; "%3D") | gsub(";"; "%3B") | gsub("\n"; "%0A"); def signal_escape: gsub("%"; "%25") | gsub(";"; "%3B") | gsub("\n"; "%0A"); map((.category | cat_escape) + "=" + (.signal | signal_escape)) | join(";")'
          hidden_sample_fixture_summary="$(jq -r "$hidden_sample_jq" docs/context-anomalies/hidden-samples-delimiters.json)"
          test "$hidden_sample_fixture_summary" = "$(cat docs/context-anomalies/hidden-samples-delimiters.summary)"
          node scripts/check_context_anomaly_hidden_samples.mjs --help
          node scripts/check_context_anomaly_hidden_samples.mjs --self-test
          hidden_sample_smoke_json="$(node scripts/check_context_anomaly_hidden_samples.mjs --json)"
          hidden_sample_smoke="$(printf '%s\n' "$hidden_sample_smoke_json" | jq -r '.summary')"
          hidden_sample_smoke_len="$(printf '%s\n' "$hidden_sample_smoke_json" | jq -r '.actual_len')"
          hidden_sample_smoke_max="$(printf '%s\n' "$hidden_sample_smoke_json" | jq -r '.max_len')"
          hidden_sample_checksum="$(printf '%s\n' "$hidden_sample_smoke_json" | jq -r '.checksum')"
          {
            echo "### Context anomalies"
            echo "- anomalies: $(jq -r '.anomaly_count // 0' context-anomalies.json)"
            echo "- high: $(jq -r '.high_count // 0' context-anomalies.json)"
            echo "- hidden: $(jq -r '(.hidden_categories // []) | join(",")' context-anomalies.json)"
            echo "- hidden samples: $(jq -r "(.hidden_samples // []) | $hidden_sample_jq" context-anomalies.json | cut -c1-256)"
            echo "- trend status: $(jq -r '.context_anomalies.latest_status // "none"' context-anomaly-dashboard.json)"
            echo "- recurring hidden: $(jq -r '(.context_anomalies.recurring_hidden_categories // []) | join(",")' context-anomaly-dashboard.json)"
            echo "- trend latest age ms: $(jq -r '.context_anomalies.latest_age_ms // 0' context-anomaly-dashboard.json)"
            echo "- trend oldest recurring hidden age ms: $(jq -r '.context_anomalies.oldest_recurring_hidden_age_ms // 0' context-anomaly-dashboard.json)"
            if [ -n "$trend_repair_hint" ]; then
              echo "- trend repair hint: $trend_repair_hint"
            fi
            echo "### Context anomaly fixture trend"
            echo "- fixture status: $(jq -r '.context_anomalies.latest_status // "none"' context-anomaly-fixture-dashboard.json)"
            echo "- fixture recurring hidden: $(jq -r '(.context_anomalies.recurring_hidden_categories // []) | join(",")' context-anomaly-fixture-dashboard.json)"
            echo "- fixture hidden samples: $(jq -r "(.context_anomalies.recurring_hidden_samples // []) | $hidden_sample_jq" context-anomaly-fixture-dashboard.json | cut -c1-256)"
            echo "- fixture oldest recurring hidden age ms: $(jq -r '.context_anomalies.oldest_recurring_hidden_age_ms // 0' context-anomaly-fixture-dashboard.json)"
            echo "- audit mode: $audit_mode_line"
            echo "- audit checksum: $audit_output_checksum"
            echo "- audit json checksum: $audit_json_checksum"
            echo "- formatter smoke: context_anomaly_hidden_sample_fixture_ok=$hidden_sample_smoke"
            echo "- formatter budget: $hidden_sample_smoke_len/$hidden_sample_smoke_max"
            echo "- formatter checksum: $hidden_sample_checksum"
            echo "- command table: docs/context-anomalies/RUNBOOK.md"
          } >> "$GITHUB_STEP_SUMMARY"
