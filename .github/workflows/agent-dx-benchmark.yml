name: Agent DX Benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/agent-dx-benchmark.yml"
      - "scripts/agent_dx_contract.py"
      - "scripts/agent_dx_reduction.py"
      - "scripts/benchmark_agent_dx.py"
      - "scripts/validate_agent_dx_benchmark.py"
      - "scripts/benchmark_common.py"
      - "scripts/benchmark_fixtures/**"
      - "scripts/tests/test_agent_dx_benchmark.py"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent-dx-benchmark.yml"
      - "scripts/agent_dx_contract.py"
      - "scripts/agent_dx_reduction.py"
      - "scripts/benchmark_agent_dx.py"
      - "scripts/validate_agent_dx_benchmark.py"
      - "scripts/benchmark_common.py"
      - "scripts/benchmark_fixtures/**"
      - "scripts/tests/test_agent_dx_benchmark.py"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  ARTIFACTS: ${{ github.workspace }}/.packet28/benchmarks/agent-dx

jobs:
  agent-dx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.93.1

      - name: Install benchmark system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends ripgrep

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Check benchmark contract controls
        run: python3 -m unittest scripts.tests.test_agent_dx_benchmark

      - name: Build measured binaries
        run: cargo build --locked -p suite-cli -p packet28d -p packet28-search-cli --bins

      # Delegated contracts run once here as named tests; the validator
      # requires every named test to report `ok` in this log.
      - name: Run delegated product tests
        run: |
          set -o pipefail
          mkdir -p "$ARTIFACTS-inputs"
          {
            cargo test --locked -p packet28d --test task_record_archive --test status_pagination \
              --test registry_repair_startup --test daemon_lifecycle
            cargo test --locked -p suite-cli --test daemon_storage_repair_e2e --test daemon_lifecycle_e2e \
              --test hook_runner_e2e --test runtime_log_rotation_e2e
            cargo test --locked -p packet28-reducer-core --lib github::
          } 2>&1 | tee "$ARTIFACTS-inputs/product-tests.log"

      - name: Run agent DX benchmark
        run: |
          python3 scripts/benchmark_agent_dx.py \
            --bin-dir "$GITHUB_WORKSPACE/target/debug" \
            --product-test-log "$ARTIFACTS-inputs/product-tests.log" \
            --artifact-dir "$ARTIFACTS"

      - name: Validate agent DX benchmark
        if: always()
        run: |
          python3 scripts/validate_agent_dx_benchmark.py "$ARTIFACTS/summary.json" \
            --bin-dir "$GITHUB_WORKSPACE/target/debug" \
            --markdown-path "$ARTIFACTS-validation.md"

      - name: Publish workflow summary
        if: always()
        run: |
          if [ -f "$ARTIFACTS-validation.md" ]; then
            cat "$ARTIFACTS-validation.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Agent DX benchmark produced no validation report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload agent DX benchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-dx-benchmark
          path: .packet28/benchmarks
          if-no-files-found: warn
